name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Add storage permissions (backup folder on phone)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q WRITE_EXTERNAL_STORAGE $MF; then
            sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application android:requestLegacyExternalStorage="true"#' $MF
          fi
          grep -n "uses-permission\|<application" $MF
      - name: Add network permissions (worker discovery)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_WIFI_MULTICAST_STATE; do
            if ! grep -q "android.permission.$P" $MF; then
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $MF
            fi
          done
          grep -n "uses-permission" $MF
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cafe-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
